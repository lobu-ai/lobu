name: Etsy API contract drift

# Answers one question: does the live Etsy Open API still match the request
# schemas and operation snapshot the example connector was written against?
#
# Deliberately NOT a PR gate. It fetches Etsy's published OpenAPI document, so
# a third-party outage or an unrelated upstream edit would red a pull request
# that never touched the connector. Same reasoning as Live Providers and the
# Slack token canary: this is an alarm, so keep it off the branch-protection
# list. The deterministic half — request encoding, scope handling, sync paging
# — runs on every PR as `bun test examples/ecommerce` in the CI unit job.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: read
concurrency:
  group: etsy-contract-drift
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-submodule
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install
      - run: bun examples/ecommerce/check-etsy-drift.ts
