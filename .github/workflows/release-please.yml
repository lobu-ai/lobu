name: Release Please

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_run_id:
        description: "Exact successful main Build and Push Images run"
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  REQUIRED_IMAGE_JOBS: generate-tag connector-parity-smoke build-worker build-embeddings-service build-app app-image-smoke promote-images

jobs:
  attest:
    name: Attest main image and CI runs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # `types: [completed]` also fires for failure and cancellation, and
    # `branches: [main]` admits a manual Build Images dispatch as readily as a
    # push. Both would start this job and then hard-fail the API checks below,
    # so screen them out here. The producer's conclusion and event are re-read
    # from the API regardless: this is noise control, not the gate.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.producer.outputs.sha }}
    steps:
      # Deliberately before any checkout: no repository code runs until the
      # producing run is known to be a completed-success push to a commit
      # that is still reachable from main.
      - name: Attest the producing Build Images run
        id: producer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IMAGE_RUN_ID: ${{ inputs.image_run_id }}
          EVENT_IMAGE_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::workflow dispatch must target main"; exit 1; }
            current_sha=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
            [ "$GITHUB_SHA" = "$current_sha" ] || { echo "::error::workflow dispatch SHA is not live main"; exit 1; }
          fi
          image_run_id="${INPUT_IMAGE_RUN_ID:-${EVENT_IMAGE_RUN_ID:-}}"
          [ -n "$image_run_id" ] || { echo "::error::image_run_id is required"; exit 1; }

          build_workflow_id=$(gh api "repos/${REPOSITORY}/actions/workflows/build-images.yml" --jq '.id')
          build_run=$(gh api "repos/${REPOSITORY}/actions/runs/${image_run_id}")
          workflow_id=$(jq -r '.workflow_id' <<<"$build_run")
          sha=$(jq -r '.head_sha' <<<"$build_run")
          head_repo=$(jq -r '.head_repository.full_name // empty' <<<"$build_run")
          event=$(jq -r '.event' <<<"$build_run")
          branch=$(jq -r '.head_branch // empty' <<<"$build_run")
          status=$(jq -r '.status' <<<"$build_run")
          conclusion=$(jq -r '.conclusion // empty' <<<"$build_run")
          [ "$workflow_id" = "$build_workflow_id" ] || { echo "::error::wrong Build Images workflow"; exit 1; }
          [ "$head_repo" = "$REPOSITORY" ] || { echo "::error::Build Images run repository mismatch"; exit 1; }
          [ "$event" = push ] && [ "$branch" = main ] || { echo "::error::Build Images run must be a main push"; exit 1; }
          [ "$status" = completed ] && [ "$conclusion" = success ] || { echo "::error::Build Images run is not completed-success"; exit 1; }

          # Reachability, not tip-ness. A release commit's own image build
          # routinely finishes after later commits have landed; demanding the
          # tip threw that run away and left the version unreleased with every
          # run green. A commit still reachable from main got there through
          # branch protection, which is the property the checkout below needs.
          current_sha=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          compare_status=$(gh api "repos/${REPOSITORY}/compare/${sha}...${current_sha}" --jq '.status')
          [ "$compare_status" = ahead ] || [ "$compare_status" = identical ] || { echo "::error::attested SHA ${sha} is not reachable from main (${compare_status})"; exit 1; }

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image_run_id=$image_run_id" >> "$GITHUB_OUTPUT"

      # Pinned to the SHA the step above proved is reachable from main, so the
      # policy helper cannot come from a ref that never merged.
      - name: Check out the attested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.producer.outputs.sha }}
          fetch-depth: 2

      - name: Attest required image jobs and the exact CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ATTESTED_SHA: ${{ steps.producer.outputs.sha }}
          IMAGE_RUN_ID: ${{ steps.producer.outputs.image_run_id }}
        run: |
          set -euo pipefail
          # Piped, never --argjson: a paginated API payload passed as a command
          # argument dies with "jq: Argument list too long" once it outgrows
          # ARG_MAX on the runner, and macOS tolerates a payload Linux rejects,
          # so it cannot be caught locally.
          gh api --paginate --slurp "repos/${REPOSITORY}/actions/runs/${IMAGE_RUN_ID}/jobs?filter=all&per_page=100" \
            | jq --arg required "$REQUIRED_IMAGE_JOBS" \
              '{pages: ., required: ($required | split(" "))}' \
            | node scripts/release-provenance.mjs attest-jobs >/dev/null

          ci_workflow_id=$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml" --jq '.id' | tr -d '\n')
          ci_run_id=""
          for _ in $(seq 1 20); do
            # Re-checked every iteration so the bounded wait still bails out
            # early: a commit force-pushed off main stops being reachable.
            current_sha=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
            compare_status=$(gh api "repos/${REPOSITORY}/compare/${ATTESTED_SHA}...${current_sha}" --jq '.status')
            [ "$compare_status" = ahead ] || [ "$compare_status" = identical ] || { echo "::error::attested SHA left main while waiting for exact CI (${compare_status})"; exit 1; }
            # Piped, never --argjson, for the same reason as the jobs read
            # above: a run list is one argv entry, and Linux caps that at
            # 128KB. Folding it into the existing `|| selection=""` also means
            # a transient API blip now costs one more turn of this bounded
            # wait instead of killing the release outright.
            selection=$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${ATTESTED_SHA}&event=push&branch=main&status=completed&per_page=100" \
              | jq --argjson workflow_id "$ci_workflow_id" --arg repo "$REPOSITORY" --arg sha "$ATTESTED_SHA" \
                '{runs: [.workflow_runs[] | . + {repo: .repository.full_name}],
                  expected: {workflow_id: $workflow_id, repo: $repo, event: "push", head_branch: "main", head_sha: $sha, status: "completed", conclusion: "success"}}' \
              | node scripts/release-provenance.mjs select-run) || selection=""
            if [ -n "$selection" ]; then
              ci_run_id=$(jq -r '.id' <<<"$selection")
              break
            fi
            sleep 20
          done
          [ -n "$ci_run_id" ] || { echo "::error::exact successful CI push/main run was not observed within the bounded wait"; exit 1; }
          echo "attested CI run for ${ATTESTED_SHA}: ${ci_run_id}"

  release-please-write:
    name: Create release from attested main
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Releases created with GITHUB_TOKEN do not trigger release-event
      # workflows, including build-images and mac-release.
      - name: Require release automation token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_PLEASE_TOKEN" ] || { echo "::error::RELEASE_PLEASE_TOKEN is required"; exit 1; }

      - name: Checkout attested commit for immutable release helper
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.attest.outputs.sha }}
          fetch-depth: 2

      - name: Recheck the attested commit is still on main before releasing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTED_SHA: ${{ needs.attest.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # main advancing after attestation is normal and harmless: the
          # release below is bound to ATTESTED_SHA, not to whatever the action
          # considers HEAD. Only an attested commit that left main is a fault.
          current_sha=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          compare_status=$(gh api "repos/${REPOSITORY}/compare/${ATTESTED_SHA}...${current_sha}" --jq '.status')
          [ "$compare_status" = ahead ] || [ "$compare_status" = identical ] || { echo "::error::attested SHA is no longer reachable from main (${compare_status})"; exit 1; }

      - name: Run Release Please against main
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-component-in-tag: true
          target-branch: main
          skip-github-release: true

      # release-please only opens the version-bump PR; the release itself is
      # created here so it is bound to the exact commit that was attested
      # above, rather than to whatever the action considered HEAD.
      # Split so the binding check can be the shared composite action rather
      # than a third copy of the same tag-peeling shell. Creation is
      # idempotent and verification runs once at the end, which covers the
      # already-exists case and the just-created case with one assertion
      # instead of two call sites that could drift apart.
      # Asks whether the manifest's version is released yet, NOT whether this
      # commit performed the bump. The bump commit stops being main's tip as
      # soon as anything merges behind it, so a parent diff only ever fired
      # inside that gap -- six minutes on 2026-09-03, which left 18.0.0
      # unreleased and, since release-please will not open a release PR while
      # an untagged merged one is outstanding, blocked every release after it.
      - name: Decide whether the attested manifest version needs a release
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTED_SHA: ${{ needs.attest.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_version=$(git show "${ATTESTED_SHA}:package.json" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          # Drafts are excluded as well as prereleases: the list endpoint returns
          # drafts to a write-scoped token, and a draft lobu-v<version> counted
          # as released would make this step skip creation AND the verify step
          # below, turning a loud "release is a draft" failure into silence.
          #
          # Piped straight into jq rather than through --argjson: the release
          # list grows without bound, and at 106 releases it already exceeded
          # ARG_MAX on the runner ("jq: Argument list too long"). This step runs
          # on every main push, so that failure blocked all releases.
          decision=$(gh api --paginate --slurp "repos/${REPOSITORY}/releases?per_page=100" \
            | jq --arg current "$current_version" \
              '{current: $current, versions: [.[][] | select((.draft or .prerelease) | not) | .tag_name | select(startswith("lobu-v")) | ltrimstr("lobu-v")]}' \
            | node scripts/release-provenance.mjs release-needed)
          if [ "$(jq -r '.needed' <<<"$decision")" != true ]; then
            echo "Manifest version ${current_version} is already released; nothing to cut."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Manifest version ${current_version} has no release yet; cutting it."
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          jq -n --arg version "$current_version" '{version: $version}' \
            | node scripts/release-provenance.mjs release-tag | jq -r '"tag=" + .tag' >> "$GITHUB_OUTPUT"

      - name: Create the tag and release if they are not already there
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ATTESTED_SHA: ${{ needs.attest.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${REPOSITORY}/releases?per_page=100" \
            | jq --arg current "$VERSION" \
              '{current: $current, versions: [.[][] | select((.draft or .prerelease) | not) | .tag_name | select(startswith("lobu-v")) | ltrimstr("lobu-v")]}' \
            | node scripts/release-provenance.mjs assert-newer >/dev/null

          if gh api "repos/${REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; the verification below still has to pass."
            exit 0
          fi

          # This version's changelog entry, not the head of the whole file:
          # CHANGELOG.md is ~490KB and newest-first, so a plain truncation puts
          # several past releases in every release body.
          #
          # Handed to jq through --rawfile, never --arg: Linux caps a SINGLE
          # argv entry at MAX_ARG_STRLEN (128KB), and this file is nearly four
          # times that, so passing it as an argument dies with "jq: Argument
          # list too long" and no release is ever created. macOS has no
          # per-argument cap, so it only ever fails in CI -- the same trap the
          # paginated `gh api` reads already carry, in the one line that reads
          # a file instead of an API page. It went unnoticed because the step
          # exits early when the release already exists, so this line first ran
          # for real at 19.0.0.
          changelog_file="${RUNNER_TEMP}/release-changelog.md"
          git show "$ATTESTED_SHA:CHANGELOG.md" > "$changelog_file" || : > "$changelog_file"
          notes=$(jq -n --rawfile changelog "$changelog_file" --arg version "$VERSION" \
            '{changelog: $changelog, version: $version}' \
            | node scripts/release-provenance.mjs release-notes | jq -r '.notes')
          notes=${notes:0:60000}
          if ! gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method POST "repos/${REPOSITORY}/git/refs" \
              --input <(jq -n --arg ref "refs/tags/$TAG" --arg sha "$ATTESTED_SHA" '{ref: $ref, sha: $sha}') >/dev/null
          fi
          gh api --method POST "repos/${REPOSITORY}/releases" \
            --input <(jq -n --arg tag "$TAG" --arg sha "$ATTESTED_SHA" --arg body "$notes" \
              '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $body, draft: false, prerelease: false, make_latest: "true"}') >/dev/null

      - name: Verify the release binds to the attested commit
        if: steps.bump.outputs.bumped == 'true'
        uses: ./.github/actions/verify-release
        with:
          tag: ${{ steps.bump.outputs.tag }}
          expected-sha: ${{ needs.attest.outputs.sha }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # release-please marks its own merged release PR `autorelease: tagged`
      # from inside the release step, and this workflow skips that step
      # (`skip-github-release: true`) so the release can be bound to the
      # attested commit rather than to whatever the action considered HEAD.
      # Nothing else moves the label, so it stays `autorelease: pending`
      # forever -- and release-please refuses to open the NEXT release PR
      # while any merged one still reads pending ("There are untagged, merged
      # release PRs outstanding - aborting"). One release therefore blocks
      # every release after it: 18.0.0 was tagged on 2026-09-03 and no
      # version-bump PR opened again until its label was corrected by hand.
      #
      # Matching is by ancestry, not by title: `assert-newer` above guarantees
      # the release just cut is the newest, so any release PR merged at or
      # before the attested commit has had its version superseded and its
      # pending label is stale by construction. A title comparison would go
      # silently stale the moment `pull-request-title-pattern` changed, which
      # is the same silence this step exists to remove.
      #
      # Merged-ness is read from the list payload, so an unmerged PR costs no
      # extra call -- and it has to be read, because release-please closes
      # every release PR it supersedes without clearing the label. Those
      # closed-unmerged ones are harmless to the abort above, which counts
      # merged PRs only, but their `merge_commit_sha` is the
      # `refs/pull/N/merge` test merge: GitHub garbage-collects it, and
      # comparing against a collected one 404s and, under `set -e`, fails this
      # job after the release was already created.
      - name: Clear the pending label from released PRs
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ATTESTED_SHA: ${{ needs.attest.outputs.sha }}
        run: |
          set -euo pipefail
          pending=$(gh api --paginate --slurp "repos/${REPOSITORY}/issues?state=closed&labels=autorelease:%20pending&per_page=100" \
            | jq -r '.[][] | select(.pull_request.merged_at) | .number')
          for pr in $pending; do
            merged_sha=$(gh api "repos/${REPOSITORY}/pulls/${pr}" --jq '.merge_commit_sha')
            compare_status=$(gh api "repos/${REPOSITORY}/compare/${merged_sha}...${ATTESTED_SHA}" --jq '.status')
            case "$compare_status" in
              ahead | identical) ;;
              *) continue ;;
            esac
            # Add then remove, so the PR is never momentarily unlabelled. The
            # DELETE is tolerated because two main pushes can both reach this
            # step for one release -- the create step above is written for that
            # same race -- and the second finds the label already gone. It
            # cannot swallow a permission fault: the POST shares the token and
            # is not tolerated.
            gh api --method POST "repos/${REPOSITORY}/issues/${pr}/labels" \
              --input <(jq -n '{labels: ["autorelease: tagged"]}') >/dev/null
            gh api --method DELETE \
              "repos/${REPOSITORY}/issues/${pr}/labels/autorelease:%20pending" >/dev/null || true
            echo "cleared the pending label from #${pr}"
          done
