name: Helm Chart

on:
  pull_request:
    paths:
      - "charts/lobu/**"
      - ".github/workflows/helm-chart.yml"
      - "release-please-config.json"
  push:
    branches:
      - main
    paths:
      - "charts/lobu/**"
      - ".github/workflows/helm-chart.yml"
      - "release-please-config.json"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the chart to GHCR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint charts/lobu

      - name: Render default values
        run: |
          helm template lobu charts/lobu --namespace lobu >/tmp/lobu-default.yaml
          if grep -q 'migration-quiesce' /tmp/lobu-default.yaml; then
            echo "migration quiesce hook must be opt-in" >&2
            exit 1
          fi

      - name: Render durable artifact storage
        run: |
          helm template lobu charts/lobu --namespace lobu \
            --set app.artifacts.enabled=true \
            --set app.artifacts.storageClass=lobu-local-retain \
            >/tmp/lobu-artifacts.yaml
          grep -q '^kind: PersistentVolumeClaim$' /tmp/lobu-artifacts.yaml
          grep -q 'storageClassName: lobu-local-retain' /tmp/lobu-artifacts.yaml
          grep -q 'name: LOBU_ARTIFACTS_DIR' /tmp/lobu-artifacts.yaml
          grep -q 'mountPath: /var/lib/lobu/artifacts' /tmp/lobu-artifacts.yaml
          grep -q 'claimName: lobu-app-artifacts' /tmp/lobu-artifacts.yaml

      - name: Require a chart version bump for runtime chart changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- \
            charts/lobu/templates charts/lobu/values.yaml; then
            exit 0
          fi
          base_version="$(git show "${BASE_SHA}:charts/lobu/Chart.yaml" | awk '$1 == "version:" { print $2; exit }')"
          head_version="$(awk '$1 == "version:" { print $2; exit }' charts/lobu/Chart.yaml)"
          if [ -z "$base_version" ] || [ -z "$head_version" ]; then
            echo "Could not read the chart version from charts/lobu/Chart.yaml." >&2
            exit 1
          fi
          if [ "$base_version" = "$head_version" ]; then
            echo "ChartVersion reconciliation requires charts/lobu/Chart.yaml#version to change with runtime chart templates or values." >&2
            exit 1
          fi

      - name: Render migration upgrade with mandatory quiescence
        run: |
          helm template lobu charts/lobu --namespace lobu --is-upgrade \
            --set migrations.enabled=true \
            >/tmp/lobu-quiesced-upgrade.yaml
          grep -q 'serviceAccountName: lobu-migration-quiesce' /tmp/lobu-quiesced-upgrade.yaml
          grep -q 'name: install-kubectl' /tmp/lobu-quiesced-upgrade.yaml
          grep -q 'trap restore_on_failure EXIT' /tmp/lobu-quiesced-upgrade.yaml
          grep -q 'migration failed with status' /tmp/lobu-quiesced-upgrade.yaml
          grep -q 'backoffLimit: 0' /tmp/lobu-quiesced-upgrade.yaml
          grep -A4 -F 'resources: ["deployments"]' /tmp/lobu-quiesced-upgrade.yaml \
            | grep -Fq 'verbs: ["get", "list", "watch"]'
          grep -q 'name: MIGRATION_PENDING_CHECK' /tmp/lobu-quiesced-upgrade.yaml
          grep -q '"helm.sh/hook-weight": "0"' /tmp/lobu-quiesced-upgrade.yaml

          helm template lobu charts/lobu --namespace lobu --is-upgrade \
            --set migrations.enabled=true \
            --set migrations.quiesceBeforeUpgrade.timeoutSeconds=17 \
            >/tmp/lobu-custom-timeout-upgrade.yaml
          # Two quiescence waits and two recovery waits retain the 600s allowance.
          grep -q '^  activeDeadlineSeconds: 668$' /tmp/lobu-custom-timeout-upgrade.yaml

          helm template lobu charts/lobu --namespace lobu --is-upgrade \
            --set migrations.enabled=true \
            --set worker.enabled=false \
            >/tmp/lobu-worker-disabled-upgrade.yaml
          grep -q 'name: WORKER_DEPLOYMENT' /tmp/lobu-worker-disabled-upgrade.yaml
          grep -q 'name: WORKER_SELECTOR' /tmp/lobu-worker-disabled-upgrade.yaml
          test "$(grep -c -- '- lobu-worker' /tmp/lobu-worker-disabled-upgrade.yaml)" -eq 2

      - name: Availability hardening stays wired
        # Both of these are silent when dropped: replicas would simply schedule
        # onto one node again, and a short full outage would go back to firing
        # nothing (every other availability alert carries `for: 15m`, which a
        # ~40s outage can never satisfy — see lobu#2543).
        run: |
          helm template lobu charts/lobu --namespace lobu \
            --set metrics.prometheusRule.enabled=true \
            >/tmp/lobu-availability.yaml
          grep -q 'topologySpreadConstraints:' /tmp/lobu-availability.yaml
          grep -q 'topologyKey: kubernetes.io/hostname' /tmp/lobu-availability.yaml
          # Without matchLabelKeys the constraint renders, passes every other
          # assertion, and intermittently colocates every replica anyway -- it
          # computes skew against the outgoing revision's pods. That is how it
          # shipped in 14.15.0, where it held both replicas on one node for 76
          # minutes and then spread correctly on the next two rollouts.
          grep -q 'pod-template-hash' /tmp/lobu-availability.yaml
          grep -q 'alert: LobuAppNoAvailableReplicas' /tmp/lobu-availability.yaml
          # A `for:` longer than the outage is exactly the bug this replaces.
          if grep -A6 'alert: LobuAppNoAvailableReplicas' /tmp/lobu-availability.yaml \
            | grep -qE '^\s+for: [1-9]'; then
            echo "LobuAppNoAvailableReplicas must not carry a nonzero for: window" >&2
            exit 1
          fi

      - name: Exercise migration failure recovery
        run: sh charts/lobu/tests/migrate-upgrade-recovery.sh

      # Artifact storage is the only durable-media path: a topology that
      # renders but cannot share bytes across replicas loses media silently.
      - name: Artifact storage topology fails closed
        run: bash charts/lobu/tests/artifacts-topology.sh

      - name: Embeddings secret projection stays minimal
        run: bash charts/lobu/tests/embeddings-secrets.sh

  publish:
    needs: lint
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: azure/setup-helm@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: helm package charts/lobu --destination /tmp

      - name: Push chart
        run: |
          chart_package="$(ls /tmp/lobu-*.tgz | head -1)"
          helm push "$chart_package" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Verify chart package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          visibility="$(
            gh api "/orgs/${OWNER}/packages/container/charts%2Flobu" \
              --jq '.visibility'
          )"
          if [ "$visibility" != "public" ]; then
            echo "::error::ghcr.io/${OWNER}/charts/lobu is ${visibility}, not public. GitHub package visibility can only be changed from the package settings UI."
            exit 1
          fi
