name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number for manual trigger'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  packages: write

# Concurrency is declared PER JOB below, not here: a workflow-level group with
# cancel-in-progress covered the cleanup job too, so a `synchronize`/`labeled`
# event landing while teardown was running cancelled the teardown and leaked
# the namespace — the accumulation this workflow's opt-in label was added to
# stop. Deploys still supersede each other; teardown is never cancelled.

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  # Previews are opt-in: deploy only when the PR carries the `preview` label
  # (or a manual workflow_dispatch). Every PR used to auto-deploy, and the
  # accumulated namespaces pinned the shared node's CPU requests at ~97% so new
  # previews could not schedule. Unlabeling tears the preview down (cleanup).
  preview:
    runs-on: ubuntu-24.04
    if: github.event.action != 'closed' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview')))
    outputs:
      preview_wanted: ${{ steps.preview-wanted.outputs.wanted }}
    concurrency:
      group: preview-deploy-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    env:
      PREVIEW_NS: lobu-preview-${{ github.event.pull_request.number || inputs.pr_number }}
      PREVIEW_NAME: lobu-pr-${{ github.event.pull_request.number || inputs.pr_number }}
      PREVIEW_IMAGE: ghcr.io/${{ github.repository }}/preview
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Deploy identity, checked before the first cluster write. KUBE_SERVER
      # and KUBE_CLUSTER_UID have no default: until an operator sets both repo
      # variables this job stops at the preflight (see the script's header).
      KUBE_EXPECTED_CONTEXT: ${{ vars.KUBE_CONTEXT || 'lobu-prod' }}
      KUBE_EXPECTED_SERVER: ${{ vars.KUBE_SERVER }}
      KUBE_EXPECTED_CLUSTER_UID: ${{ vars.KUBE_CLUSTER_UID }}
      KUBE_REQUIRED_CAPABILITIES: |
        get|namespaces|
        create|namespaces|
        patch|namespaces|
        delete|namespaces|
        get|priorityclasses.scheduling.k8s.io|
        create|priorityclasses.scheduling.k8s.io|
        patch|priorityclasses.scheduling.k8s.io|
        get|resourcequotas|@PREVIEW_NS
        create|resourcequotas|@PREVIEW_NS
        patch|resourcequotas|@PREVIEW_NS
        get|secrets|@PREVIEW_NS
        create|secrets|@PREVIEW_NS
        get|deployments.apps|@PREVIEW_NS
        create|deployments.apps|@PREVIEW_NS
        patch|deployments.apps|@PREVIEW_NS
        delete|deployments.apps|@PREVIEW_NS
        watch|deployments.apps|@PREVIEW_NS
        create|services|@PREVIEW_NS
        delete|services|@PREVIEW_NS
        get|ingresses.networking.k8s.io|@PREVIEW_NS
        create|ingresses.networking.k8s.io|@PREVIEW_NS
        patch|ingresses.networking.k8s.io|@PREVIEW_NS
    steps:
      - uses: actions/checkout@v7

      - id: submodule
        uses: ./.github/actions/setup-submodule
        with:
          deploy-key: ${{ secrets.OWLETTO_WEB_DEPLOY_KEY }}

      - name: Setup and preflight kubeconfig
        id: kube-preflight
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          ./scripts/lib/kubeconfig-preflight.sh setup

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push preview image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          # Keep the embedded-postgres runtime for DATABASE_URL=file:// previews.
          build-args: |
            KEEP_EMBEDDED_PG=1
          push: true
          tags: ${{ env.PREVIEW_IMAGE }}:pr-${{ env.PR_NUMBER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create preview namespace
        run: |
          kubectl create namespace "$PREVIEW_NS" --dry-run=client -o yaml | kubectl apply -f -

      - name: Cap preview capacity (half-node budget)
        run: |
          # Previews + herdr share half of the node (6 CPU / 63Gi on lobu-prod).
          # A low priority class means prod pods preempt preview/herdr pods under
          # pressure; the per-namespace quota caps one PR at its slice.
          kubectl apply -f - <<'EOF'
          apiVersion: scheduling.k8s.io/v1
          kind: PriorityClass
          metadata:
            name: preview
          value: -10
          globalDefault: false
          description: "PR previews + herdr - preempted by prod (default) pods"
          EOF
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: preview-quota
            namespace: $PREVIEW_NS
          spec:
            hard:
              requests.cpu: "1"
              requests.memory: 2Gi
              limits.cpu: "4"
              limits.memory: 8Gi
              pods: "2"
          EOF

      - name: Provision encryption key
        run: |
          # Stable per-namespace key so a redeploy (or mid-life pod restart) can
          # still read secrets written by the previous pod. The data volume is
          # emptyDir, so nothing survives a redeploy itself.
          if ! kubectl -n "$PREVIEW_NS" get secret preview-encryption >/dev/null 2>&1; then
            kubectl -n "$PREVIEW_NS" create secret generic preview-encryption \
              --from-literal=key="$(openssl rand -base64 32)"
          fi

      - name: Deploy preview
        run: |
          # Clean up any existing resources from previous runs. The ingress is
          # deliberately NOT deleted: the tailscale operator's proxy pod carries
          # the TLS cert, and deleting + recreating the ingress spins a fresh
          # proxy that must re-issue a Let's Encrypt cert (5/week per hostname -
          # redeploys exhaust it and the host goes dark until the limit resets).
          # Apply updates the ingress in place; PR close deletes the namespace,
          # which removes the ingress and lets the operator reap the proxy.
          kubectl -n "$PREVIEW_NS" delete deployment "$PREVIEW_NAME" --ignore-not-found
          kubectl -n "$PREVIEW_NS" delete svc "$PREVIEW_NAME" --ignore-not-found

          # Read the label here rather than from the event payload so a
          # workflow_dispatch redeploy of a locked PR sees the lock too.
          #
          # The gh call gets its own line on purpose. Piped straight into grep
          # the step would take grep's status, and this shell has no pipefail:
          # a rate limit or 5xx would read as "not labelled" and redeploy with
          # passwordless bootstrap enabled while the staging ingress still
          # points the public host at this pod. As an assignment, `-e` aborts.
          PR_LABELS="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')"
          LOCK_ENV='- { name: LOBU_LOCAL_INIT_ALLOW_PROXY, value: "1" }'
          if printf '%s\n' "$PR_LABELS" | grep -qx staging; then
            # Drop the passwordless bootstrap (see above) and pin the public
            # origin. resolvePublicOrigin falls back to the request URL, which
            # behind the ingress reads as http://<host> — OAuth metadata and the
            # MCP App asset URLs would both be stamped http and rejected by the
            # host's sandbox.
            LOCK_ENV='- { name: PUBLIC_GATEWAY_URL, value: "https://${{ vars.STAGING_HOST || 'staging.lobu.ai' }}/lobu" }'
            echo "staging lock held by this PR - passwordless bootstrap disabled"
          fi

          # The embedded runner binds 127.0.0.1 (HOST below) so /api/local-init
          # sees a loopback peer. socat accepts external connections on 8788 and
          # forwards them over loopback to the app on 8787.
          # LOBU_LOCAL_INIT_ALLOW_PROXY: the private tailnet ingress (Tailscale
          # Serve) injects Forwarded-* headers; tolerate them for this single-user
          # preview so /api/local-init sign-in works (peer is loopback via socat).
          # Set ONLY while this PR is tailnet-only. The `staging` label puts the
          # same pod behind the public staging host, where the setting would let
          # anyone on the internet mint an owner session (auth/routes.ts names
          # public tunnels as the case it refuses by default). staging.yml also strips
          # the var when it acquires the lock; deciding it here as well is what
          # stops the next push to a locked PR from handing it back.
          # CHOKIDAR_USEPOLLING: the container's default nofile ulimit is 1024, and
          # Vite's inotify watch fds blow through it at boot on a monorepo tree
          # (EMFILE crash, seen after the image grew). Polling uses stat() calls
          # instead; the 4-CPU limit absorbs the polling cost.
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: $PREVIEW_NAME
            namespace: $PREVIEW_NS
          spec:
            replicas: 1
            # The namespace quota grants one pod's worth of CPU, so a rolling
            # update can never schedule the surge replica: it stalls at "0 of 1
            # updated" until the timeout. Replace the pod instead of surging.
            strategy: { type: Recreate }
            selector:
              matchLabels: { app: $PREVIEW_NAME }
            template:
              metadata:
                labels: { app: $PREVIEW_NAME }
              spec:
                priorityClassName: preview
                containers:
                  - name: preview
                    image: ${{ env.PREVIEW_IMAGE }}:pr-${{ env.PR_NUMBER }}
                    imagePullPolicy: Always
                    command: ["sh", "-c", "socat TCP-LISTEN:8788,fork,reuseaddr TCP:127.0.0.1:8787 & exec node packages/server/dist/server.bundle.mjs"]
                    env:
                      - { name: PORT, value: "8787" }
                      - { name: HOST, value: "127.0.0.1" }
                      - { name: DATABASE_URL, value: "file:///var/lib/lobu/data/lobu.db" }
                      - { name: NODE_ENV, value: "development" }
                      - { name: CHOKIDAR_USEPOLLING, value: "true" }
                      # A preview has one backend pod, so it is safe to exercise
                      # the complete multi-workspace grant path before the
                      # coordinated production rollout enables it.
                      - { name: LOBU_OAUTH_MULTI_WORKSPACE_GRANTS, value: "1" }
                      - { name: ENCRYPTION_KEY, valueFrom: { secretKeyRef: { name: preview-encryption, key: key } } }
                      ${LOCK_ENV}
                    ports:
                      - { containerPort: 8787 }
                    readinessProbe:
                      httpGet: { path: /api/health, port: 8788 }
                      initialDelaySeconds: 30
                      periodSeconds: 5
                      failureThreshold: 30
                    resources:
                      requests: { cpu: "1", memory: 2Gi }
                      limits: { cpu: "4", memory: 8Gi }
                    volumeMounts:
                      - { name: data, mountPath: /var/lib/lobu/data }
                volumes:
                  - name: data
                    emptyDir: {}
          EOF

          kubectl expose deployment "$PREVIEW_NAME" \
            -n "$PREVIEW_NS" \
            --port=80 \
            --target-port=8788 \
            --type=ClusterIP

          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: $PREVIEW_NAME
            namespace: $PREVIEW_NS
          spec:
            ingressClassName: tailscale
            # The tailscale operator only serves rules whose host matches the
            # TLS host, and rejects tags its OAuth client may not create
            # (defaults to tag:k8s). No tags annotation here.
            tls:
              - hosts:
                  - lobu-pr-$PR_NUMBER.${{ vars.TAILNET_DOMAIN }}
            rules:
              - host: lobu-pr-$PR_NUMBER.${{ vars.TAILNET_DOMAIN }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: $PREVIEW_NAME
                          port:
                            number: 80
          EOF

      - name: Wait for preview to be ready
        run: |
          kubectl rollout status deployment/"$PREVIEW_NAME" \
            -n "$PREVIEW_NS" \
            --timeout=600s

      - name: Detect authorization UI changes
        id: oauth-ui-scope
        run: |
          set -euo pipefail
          changed_files=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate \
            --jq '.[].filename')
          if grep -Eq '^(packages/owletto$|packages/server/src/auth/oauth/)' <<<"$changed_files"; then
            echo "capture=true" >>"$GITHUB_OUTPUT"
          else
            echo "capture=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Capture authorization UI proof
        id: oauth-ui-proof
        if: steps.oauth-ui-scope.outputs.capture == 'true'
        env:
          PROOF_BASE_URL: http://127.0.0.1:8787
          PROOF_OUTPUT_DIR: ${{ runner.temp }}/oauth-authorization-ui
          PLAYWRIGHT_RUNTIME: ${{ runner.temp }}/oauth-playwright
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_OUTPUT_DIR" "$PLAYWRIGHT_RUNTIME"

          kubectl -n "$PREVIEW_NS" port-forward \
            service/"$PREVIEW_NAME" 8787:80 \
            >"$PROOF_OUTPUT_DIR/port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS "$PROOF_BASE_URL/api/health" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$PROOF_OUTPUT_DIR/port-forward.log"
              exit 1
            fi
            sleep 1
          done

          chrome_path=$(command -v google-chrome-stable || command -v google-chrome)
          npm install \
            --prefix "$PLAYWRIGHT_RUNTIME" \
            --no-package-lock \
            --no-save \
            playwright-core@1.60.0

          CHROME_PATH="$chrome_path" node scripts/oauth-authorization-ui-proof.mjs \
            | tee "$PROOF_OUTPUT_DIR/proof.log"
          echo "native_report_path=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.PROOF_OUTPUT_DIR + "/results.json", "utf8")).native_report.path')" >> "$GITHUB_OUTPUT"

      - name: Upload authorization UI proof
        id: oauth-ui-proof-upload
        if: always() && steps.oauth-ui-scope.outputs.capture == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: oauth-authorization-ui-pr-${{ env.PR_NUMBER }}
          path: ${{ runner.temp }}/oauth-authorization-ui
          if-no-files-found: error
          retention-days: 14

      # Deploy and cleanup run in disjoint concurrency groups (so teardown is
      # never cancelled), which opens the reverse window: a close/unlabel that
      # lands mid-deploy no longer cancels this run, and the surviving deploy
      # would recreate the namespace cleanup just deleted. Re-check the PR's
      # state after deploying and tear down if the preview is no longer wanted.
      # This runs BEFORE the comment step so we never announce a preview we are
      # about to delete in this same run.
      - name: Tear down if the PR closed or lost the preview label mid-deploy
        id: preview-wanted
        if: always() && steps.kube-preflight.outcome == 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # ONE fetch, both answers read from it. Two calls can straddle a
          # close landing between them and return state=open with the label
          # still attached, which keeps a namespace cleanup already deleted —
          # the exact permanent leak this step exists to prevent.
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          state=$(jq -r '.state' <<<"$pr")
          labeled=$(jq -r '[.labels[].name] | index("preview") != null' <<<"$pr")
          echo "PR state=$state preview-labeled=$labeled"
          # `.state` is only ever `open` or `closed` (a merged PR reads
          # `closed`, with `.merged` carrying that distinction), so any
          # non-open value means the preview is no longer wanted.
          if [ "$state" != "open" ] || [ "$labeled" != "true" ]; then
            echo "Preview no longer wanted; deleting namespace $PREVIEW_NS"
            kubectl delete namespace "$PREVIEW_NS" --ignore-not-found
            echo "wanted=false" >>"$GITHUB_OUTPUT"
          else
            echo "wanted=true" >>"$GITHUB_OUTPUT"
          fi

      # Suppressed when the re-check above tore the preview down: announcing
      # "Status: Running" on a PR whose namespace this same run just deleted is
      # worse than saying nothing. A skipped re-check (workflow_dispatch) leaves
      # the output empty, which still posts.
      - name: Comment on PR
        if: steps.preview-wanted.outputs.wanted != 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request?.number ?? Number(process.env.PR_NUMBER);
            const previewUrl = `https://lobu-pr-${prNumber}.${{ vars.TAILNET_DOMAIN }}`;
            const proofUrl = `${{ steps.oauth-ui-proof-upload.outputs.artifact-url || '' }}`;
            const nativeReportPath = `${{ steps.oauth-ui-proof.outputs.native_report_path || '' }}`;

            // Paginate: listComments defaults to 30 per page, and busy PRs
            // (review bots post here) routinely exceed that - the existing
            // preview comment would never be found and a duplicate posted.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview environment')
            );

            const body = [
              "## Preview environment ready",
              "",
              "| | |",
              "|---|---|",
              `| **URL** | [${previewUrl}](${previewUrl}) |`,
              `| **Namespace** | \`lobu-preview-${prNumber}\` |`,
              "| **Status** | Running |",
              ...(nativeReportPath ? [`| **Synthetic native report** | [Open saved report](${previewUrl}${nativeReportPath}) |`] : []),
              ...(proofUrl ? [`| **OAuth UI proof** | [Download screenshots](${proofUrl}) |`] : []),
              "",
              "_This preview is deleted when the PR closes or when the `preview` label is removed._",
            ].join("\n");

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Remove kubeconfig
        if: always()
        run: ./scripts/lib/kubeconfig-preflight.sh cleanup

  # nginx resolves the preview Service name when the router config loads, while
  # this workflow recreates that ClusterIP Service on every deploy. Reconcile
  # only after the replacement is ready, under the same global lock used by
  # label and manual staging changes.
  reconcile-staging:
    needs: preview
    runs-on: ubuntu-24.04
    if: needs.preview.result == 'success' && needs.preview.outputs.preview_wanted != 'false' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'staging')
    concurrency:
      group: staging-lock
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      STAGING_HOST: ${{ vars.STAGING_HOST || 'staging.lobu.ai' }}
      # No tailnet knobs: this job only reconciles the `preview` target, and
      # those are read solely by staging-route.sh's local-tailnet path.
      STAGING_SKIP_COMMENT: '1'
      WILDCARD_TLS_NS: summaries-prod
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KUBE_EXPECTED_CONTEXT: ${{ vars.KUBE_CONTEXT || 'lobu-prod' }}
      KUBE_EXPECTED_SERVER: ${{ vars.KUBE_SERVER }}
      KUBE_EXPECTED_CLUSTER_UID: ${{ vars.KUBE_CLUSTER_UID }}
      KUBE_REQUIRED_CAPABILITIES: |
        get|namespaces|
        create|namespaces|
        patch|namespaces|
        list|ingresses.networking.k8s.io|@ALL_NAMESPACES
        delete|ingresses.networking.k8s.io|@ALL_NAMESPACES
        get|services|@ALL_NAMESPACES
        get|deployments.apps|@ALL_NAMESPACES
        patch|deployments.apps|@ALL_NAMESPACES
        watch|deployments.apps|@ALL_NAMESPACES
        get|configmaps|lobu-staging
        create|configmaps|lobu-staging
        patch|configmaps|lobu-staging
        get|deployments.apps|lobu-staging
        create|deployments.apps|lobu-staging
        patch|deployments.apps|lobu-staging
        watch|deployments.apps|lobu-staging
        get|services|lobu-staging
        create|services|lobu-staging
        patch|services|lobu-staging
        delete|services|lobu-staging
        watch|services|lobu-staging
        get|pods|lobu-staging
        create|pods|lobu-staging
        delete|pods|lobu-staging
        watch|pods|lobu-staging
        get|pods/log|lobu-staging
        get|ingresses.networking.k8s.io|lobu-staging
        create|ingresses.networking.k8s.io|lobu-staging
        patch|ingresses.networking.k8s.io|lobu-staging
        get|secrets|@WILDCARD_TLS_NS
        get|secrets|lobu-staging
        create|secrets|lobu-staging
        patch|secrets|lobu-staging
    steps:
      - uses: actions/checkout@v7

      - name: Setup and preflight kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          ./scripts/lib/kubeconfig-preflight.sh setup

      - name: Reconcile staging to the recreated preview Service
        run: bash scripts/staging-route.sh preview "$PR_NUMBER"

      - name: Remove kubeconfig
        if: always()
        run: ./scripts/lib/kubeconfig-preflight.sh cleanup

  cleanup:
    runs-on: ubuntu-24.04
    if: (github.event.action == 'closed' || (github.event.action == 'unlabeled' && github.event.label.name == 'preview')) && github.event.pull_request.head.repo.full_name == github.repository
    # Own group, never cancelled: teardown must run to completion even if a
    # deploy for the same PR is queued behind or ahead of it.
    concurrency:
      group: preview-cleanup-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PREVIEW_NS: lobu-preview-${{ github.event.pull_request.number }}
      PREVIEW_NAME: lobu-pr-${{ github.event.pull_request.number }}
      # Deploy identity, checked before the first cluster write. KUBE_SERVER
      # and KUBE_CLUSTER_UID have no default: until an operator sets both repo
      # variables this job stops at the preflight (see the script's header).
      KUBE_EXPECTED_CONTEXT: ${{ vars.KUBE_CONTEXT || 'lobu-prod' }}
      KUBE_EXPECTED_SERVER: ${{ vars.KUBE_SERVER }}
      KUBE_EXPECTED_CLUSTER_UID: ${{ vars.KUBE_CLUSTER_UID }}
      KUBE_REQUIRED_CAPABILITIES: |
        get|namespaces|
        delete|namespaces|
    steps:
      - uses: actions/checkout@v7

      - name: Setup and preflight kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          ./scripts/lib/kubeconfig-preflight.sh setup

      - name: Delete preview namespace
        run: |
          kubectl delete namespace "$PREVIEW_NS" --ignore-not-found

      - name: Delete preview image tag
        # Best-effort GC: GITHUB_TOKEN cannot always delete org-owned package
        # versions, and the namespace is already gone - a failure here should
        # not turn a completed cleanup into a red check.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          VERSION_ID=$(gh api "orgs/lobu-ai/packages/container/lobu%2Fpreview/versions" --paginate -q ".[] | select(.metadata.container.tags[]? == \"pr-${PR_NUM}\") | .id" | head -1)
          if [ -n "$VERSION_ID" ]; then
            gh api -X DELETE "orgs/lobu-ai/packages/container/lobu%2Fpreview/versions/$VERSION_ID"
            echo "deleted preview image tag pr-$PR_NUM"
          else
            echo "no preview image tag pr-$PR_NUM to delete"
          fi

      - name: Remove kubeconfig
        if: always()
        run: ./scripts/lib/kubeconfig-preflight.sh cleanup

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // Paginate: listComments defaults to 30 per page, and busy PRs
            // (review bots post here) routinely exceed that - the existing
            // preview comment would never be found and a duplicate posted.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview environment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: '## Preview environment cleaned up\n\n_The preview environment for this PR has been deleted._',
              });
            }
