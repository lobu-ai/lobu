name: Build and Push Images

# GitHub keeps only one pending run per concurrency group. On 2026-07-28 the
# `lobu-v14.4.0` release queued behind a main build, then a later main push
# evicted it. The version images were not published until a manual rerun. Give
# releases their own group so routine merges cannot evict them.
#
# Pushes deliberately keep the default single-item queue so bursts coalesce to
# the newest commit. `queue: max` is not conditional, so setting it here would
# queue intermediate pushes instead. cancel-in-progress stays false because
# cancelling a running build can leave only some of the shared image tags
# published.
#
# Separate groups let a release and push run in the same second. generate-tag
# therefore appends a zero-padded run number to the timestamp; the timestamp
# preserves Flux ordering across reruns and the run number breaks ties. The
# matching ImagePolicy lives in the owletto submodule and accepts both the old
# two-segment tags and the new three-segment form.
concurrency:
  group: build-images${{ github.event_name == 'workflow_dispatch' && '-manual' || github.event_name == 'release' && '-release' || '' }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  # release-please publishes `lobu-vX.Y.Z`. Building on that too is what gives
  # the images a semver tag and repoints `latest` at a release instead of an
  # arbitrary commit (#2184). Unrelated releases are ignored.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms for the docker builds. Defaults to amd64 only — bump to linux/amd64,linux/arm64 when you need the multi-arch image (rare)."
        type: string
        default: linux/amd64
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Image names are pinned so the GitOps repo's ImageUpdateAutomation keeps
  # tracking ghcr.io/lobu-ai/lobu-{app,worker,embeddings} after the
  # lobu -> lobu monorepo consolidation.
  IMAGE_NAME_APP: lobu-ai/lobu-app
  IMAGE_NAME_WORKER: lobu-ai/lobu-worker
  IMAGE_NAME_EMBEDDINGS: lobu-ai/lobu-embeddings
  # Excluded by Flux's timestamp-only ImagePolicy. Only promote-images may
  # publish deployment, semver, or latest tags after the candidate passes.
  CANDIDATE_TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}
  # Prod runs Hetzner cpx41 (x86_64 only — see project_hetzner_prod_cost
  # memory), so main-branch pushes build amd64 only. This dropped the
  # build-app step from ~25min to ~8min AND fixed the disk-full failure
  # mode (~14GB GHA runner couldn't hold both arch Playwright/Chrome
  # downloads + image layers + buildx cache).
  #
  # Releases are the exception: the tagged images are what self-hosters
  # pull, and a chunk of them are on arm64 (Apple Silicon, Ampere, Graviton).
  # Until this, `inputs.platforms` was only populated on workflow_dispatch,
  # so every published release fell through to amd64-only and ARM operators
  # silently ran the whole stack — Chromium included — under emulation.
  # Releases are rare and not latency-sensitive, so they absorb the longer
  # multi-arch build; main pushes stay fast.
  BUILD_PLATFORMS: >-
    ${{ inputs.platforms
        || (github.event_name == 'release' && 'linux/amd64,linux/arm64')
        || 'linux/amd64' }}

jobs:
  # A manual run is allowed only from the current main tip. This job performs
  # no checkout, so an old branch cannot execute repository code before the
  # guard has passed. Manual runs have their own concurrency group above and
  # therefore cannot evict a pending main push.
  current-main-guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require manual dispatch from current main
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "::error::manual image builds must target main"; exit 1; }
          current_sha=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          [ "$current_sha" = "$DISPATCH_SHA" ] || { echo "::error::manual image build is not at current main"; exit 1; }
      - name: Allow automated event
        if: github.event_name != 'workflow_dispatch'
        run: echo "automated event does not need a manual ref guard"

  generate-tag:
    runs-on: ubuntu-24.04
    needs: [current-main-guard]
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
      semver: ${{ steps.tags.outputs.semver }}
      is_stable: ${{ steps.tags.outputs.is_stable }}
      should_publish: ${{ steps.tags.outputs.should_publish }}
    steps:
      # Only this job needs the repo; the build jobs check out separately.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Prefix-gated as well as event-gated: derive-image-tags deliberately
      # returns should_publish=false for another component's release sharing
      # this event feed (owletto-mac-v*), and verify-release would throw "not a
      # Lobu release tag" first, turning that graceful skip into a red job.
      - name: Verify published release binds to this immutable commit
        if: >-
          github.event_name == 'release' &&
          startsWith(github.event.release.tag_name, 'lobu-v')
        uses: ./.github/actions/verify-release
        with:
          tag: ${{ github.event.release.tag_name }}
          expected-sha: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Every tag decision lives in scripts/derive-image-tags.mjs so it is
      # covered by scripts/__tests__/derive-image-tags.test.ts. Computed once
      # here so app/worker/embeddings cannot disagree about the tag,
      # eligibility, or version.
      - name: Derive image tags
        id: tags
        env:
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || false }}
        run: node scripts/derive-image-tags.mjs

  # Connector-runtime parity smoke gate (main/deploy side). RUNS the built worker
  # artifact's self-check before any deployable tag is published, so the
  # packaging/parity drift that broke prod (worker image missing `COPY
  # packages/core` → dangling transitive `@lobu/core` → every feed sync
  # crashed, all CI green) can't ship.
  # `build-worker` depends on this, and `build-app` depends on `build-worker`.
  # Promotion waits for all three candidate builds and the app-image smoke
  # before publishing the shared tag Flux deploys to app, worker, and
  # embeddings.
  #
  # amd64-only (no QEMU/arm64): a smoke gate, not a release. Reuses the same GHA
  # buildx cache scope as `build-worker` so this doesn't double the build cost.
  connector-parity-smoke:
    runs-on: ubuntu-24.04
    needs: [generate-tag]
    if: needs.generate-tag.outputs.should_publish == 'true'
    timeout-minutes: 25
    # Builds + runs the image locally (push: false), so it never needs the
    # top-level `packages: write`. Drop to read-only for least privilege.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build worker image (amd64, load, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          file: ./docker/worker/Dockerfile
          load: true
          push: false
          tags: lobu-worker:parity-smoke
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Worker image self-check (docker run --network=none)
        # The image runs under Node so the connector isolate lane (isolated-vm,
        # a V8 addon Bun cannot load) works in prod. A green self-check alone
        # does not prove that addon's native build, so assert the lane too: an
        # unavailable lane means the builder's node-gyp toolchain or the
        # optionalDependency install regressed inside the image.
        run: |
          set -o pipefail
          docker run --rm --network=none lobu-worker:parity-smoke \
            node dist/bin.js self-check --json | tee worker-self-check.json
          jq -e '.isolate_lane.available == true' worker-self-check.json >/dev/null || {
            echo "::error::worker image cannot load isolated-vm: $(jq -c .isolate_lane worker-self-check.json)"
            exit 1
          }

  build-app:
    runs-on: ubuntu-24.04
    if: needs.generate-tag.outputs.should_publish == 'true'
    needs: [generate-tag, build-worker, build-embeddings-service]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - id: submodule
        uses: ./.github/actions/setup-submodule
        with:
          deploy-key: ${{ secrets.OWLETTO_WEB_DEPLOY_KEY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_APP }}
          tags: |
            type=raw,value=${{ env.CANDIDATE_TAG }}

      - name: Build and push App candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.BUILD_PLATFORMS }}
          file: ./docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=min,scope=app
          build-args: |
            CACHEBUST=${{ github.sha }}
            APP_GIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_id }}
            SKIP_WEB_BUILD=${{ steps.submodule.outputs.stubbed == 'true' }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_ENVIRONMENT=production

      - name: Make image public
        run: |
          curl -L -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/packages/container/lobu-app/visibility \
            -d '{"visibility":"public"}' || true

  # Smoke the immutable candidate before any deployable app tag exists.
  # Promotion re-tags this same digest; it never rebuilds the tested image.
  app-image-smoke:
    runs-on: ubuntu-24.04
    needs: [generate-tag, build-app]
    if: needs.generate-tag.outputs.should_publish == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lobu_app_smoke
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/lobu_app_smoke
    steps:
      # Only the smoke script is used from the checkout; the image under test
      # comes from the registry.
      - uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Isolated exact-version browser driver; no workspace install or secrets.
      # Ubuntu's runner image supplies Google Chrome.
      - name: Install MCP smoke browser driver
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-smoke"
          echo '{"private":true}' > "$RUNNER_TEMP/mcp-smoke/package.json"
          bun add --cwd "$RUNNER_TEMP/mcp-smoke" --exact playwright-core@1.60.0
          echo "NODE_PATH=$RUNNER_TEMP/mcp-smoke/node_modules" >> "$GITHUB_ENV"

      - name: Smoke the candidate app digest
        run: |
          chmod +x scripts/app-image-smoke.sh
          scripts/app-image-smoke.sh \
            "${REGISTRY}/${IMAGE_NAME_APP}@${{ needs.build-app.outputs.digest }}"

  promote-images:
    runs-on: ubuntu-24.04
    needs: [generate-tag, build-app, build-worker, build-embeddings-service, app-image-smoke]
    if: needs.generate-tag.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested digests, app last for Flux
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_APP }}@${{ needs.build-app.outputs.digest }}
          WORKER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}@${{ needs.build-worker.outputs.digest }}
          EMBEDDINGS_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_EMBEDDINGS }}@${{ needs.build-embeddings-service.outputs.digest }}
          DEPLOY_TAG: ${{ needs.generate-tag.outputs.tag }}
          SEMVER: ${{ needs.generate-tag.outputs.semver }}
          IS_STABLE: ${{ needs.generate-tag.outputs.is_stable }}
        run: bash scripts/promote-images.sh

  # Package publication belongs after the exact release artifact passes its
  # runtime smoke. Dispatch from current main so the hardened workflow policy
  # is used; the release tag is data, not the workflow ref. Pass this exact run
  # ID so the downstream gate cannot select a different producer.
  trigger-package-publish:
    runs-on: ubuntu-24.04
    needs: [generate-tag, promote-images]
    if: >-
      github.event_name == 'release'
      && needs.generate-tag.outputs.should_publish == 'true'
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger publish-packages for the smoked release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh workflow run publish-packages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$RELEASE_TAG" \
            -f image_run_id="$GITHUB_RUN_ID"

  build-worker:
    runs-on: ubuntu-24.04
    # Gate the worker push (and transitively the app push, which `needs:
    # build-worker`) on the parity smoke passing.
    needs: [generate-tag, connector-parity-smoke]
    if: needs.generate-tag.outputs.should_publish == 'true'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}
          tags: |
            type=raw,value=${{ env.CANDIDATE_TAG }}

      - name: Build and push Worker candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.BUILD_PLATFORMS }}
          file: ./docker/worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Share the buildx cache scope with the connector-parity-smoke job so
          # its amd64 layers are reused here (only the arm64 leg is new work).
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Make image public
        run: |
          curl -L -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/packages/container/lobu-worker/visibility \
            -d '{"visibility":"public"}' || true

  build-embeddings-service:
    runs-on: ubuntu-24.04
    needs: [generate-tag]
    if: needs.generate-tag.outputs.should_publish == 'true'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_EMBEDDINGS }}
          tags: |
            type=raw,value=${{ env.CANDIDATE_TAG }}

      - name: Build and push Embeddings Service candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.BUILD_PLATFORMS }}
          file: ./docker/embeddings-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=embeddings
          cache-to: type=gha,mode=max,scope=embeddings

      - name: Make image public
        run: |
          curl -L -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user/packages/container/lobu-embeddings/visibility \
            -d '{"visibility":"public"}' || true

  # A failed build, smoke, promotion, or package dispatch fails the workflow.
  # Candidate build or smoke failures never publish the app timestamp tag Flux
  # watches.
  notify-failure:
    runs-on: ubuntu-24.04
    needs: [generate-tag, connector-parity-smoke, build-worker, build-embeddings-service, build-app, app-image-smoke, promote-images, trigger-package-publish]
    if: >-
      failure()
      && needs.generate-tag.outputs.should_publish == 'true'
      && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    permissions:
      contents: read
    steps:
      - name: Post failure to Slack devops
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_SUMMARY: ${{ github.event.head_commit.message || github.event.release.name || github.ref_name }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA_SHORT: ${{ github.sha }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_DEPLOY_WEBHOOK_URL not set; skipping notification."
            exit 0
          fi
          # First line of commit/release summary only, JSON-escaped via jq.
          first_line=$(printf '%s' "$RUN_SUMMARY" | head -n1)
          payload=$(jq -nc \
            --arg text "<@U09513HH1N1> :rotating_light: build-images failed on \`${REF_NAME}\` — sibling image tags may be incomplete, or the pushed app image failed its smoke. <${RUN_URL}|run> · <${COMMIT_URL}|${SHA_SHORT:0:7}> by ${ACTOR}\n> ${first_line}" \
            '{text: $text}')
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
