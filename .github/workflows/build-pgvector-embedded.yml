name: Build pgvector-embedded artifacts

# Rebuilds the prebuilt pgvector artifacts vendored in
# packages/pgvector-embedded/prebuilt/<platform>/ for every platform
# embedded-postgres supports. Run on demand (bump pgvector / PG major) or when
# build.sh changes on main. embedded-postgres ships vanilla PG 18 with no
# pgvector, so each cell compiles pgvector against a same-major PostgreSQL (the
# extension ABI is stable within a major) and uploads the result; a final job
# opens a PR with the regenerated artifacts.
#
# Windows (windows-x64) is intentionally NOT built yet — pgvector on Windows
# needs an MSVC/nmake build the bash script doesn't cover. Follow-up.

on:
  workflow_dispatch:
    inputs:
      pgvector_version:
        description: pgvector git tag to build
        default: v0.8.1
  push:
    # Branch-scoped on purpose: a bare `paths` filter also matches tag pushes,
    # and GitHub can't diff a freshly-created ref so it ignores the filter and
    # runs anyway — which meant every release-please tag (`lobu-vX.Y.Z`) kicked
    # off a rebuild and opened a churn PR (the builds aren't byte-reproducible).
    # Restricting to `main` excludes tag refs. Only build.sh affects the
    # artifacts, so the workflow file itself is intentionally not a path here.
    branches: [main]
    paths:
      - packages/pgvector-embedded/scripts/build.sh

permissions:
  contents: write
  pull-requests: write

env:
  PGVECTOR_VERSION: ${{ inputs.pgvector_version || 'v0.8.1' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15 }
          # macos-15-intel is GitHub's x86_64 macOS runner. The old macos-13
          # (Intel) image was retired Dec 2025, so that label queues forever.
          # macos-15-intel runs Intel on macOS 15 (available until ~Aug 2027,
          # the last x86_64 macOS image GitHub will offer).
          - { platform: darwin-x64, runner: macos-15-intel }
          # Built INSIDE debian:bullseye, not on the runner image. A shared
          # library links against the glibc it was compiled on and refuses to
          # load on anything older, so the build host's glibc IS the support
          # floor. `ubuntu-latest` silently became 24.04 (glibc 2.39), which
          # published a `vector.so` requiring GLIBC_2.38 (via
          # `__isoc23_strtol`, the gcc-13 uplift) — so `lobu run` could not
          # boot embedded Postgres on Debian 12 (incl. `node:26-slim`, the
          # most obvious Docker base), Ubuntu 22.04 LTS, RHEL 9 or AL2023.
          # bullseye is glibc 2.31, which clears all of them. Verified by the
          # "assert glibc floor" step below, so this cannot regress silently
          # the next time a runner label is re-pointed.
          - { platform: linux-x64, runner: ubuntu-latest, container: debian:bullseye }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, container: debian:bullseye }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    steps:
      # The bullseye container is bare — checkout needs git, and everything
      # after needs a toolchain. Runs before checkout on purpose.
      - name: Bootstrap container
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gnupg make gcc libc6-dev binutils lsb-release

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: runner.os == 'macOS'
        with:
          node-version: 26

      - name: Install PostgreSQL 18 dev (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@18
          echo "PG_CONFIG=$(brew --prefix postgresql@18)/bin/pg_config" >> "$GITHUB_ENV"

      - name: Install PostgreSQL 18 dev (Linux)
        if: runner.os == 'Linux'
        run: |
          # Use the official pgdg setup script rather than a hand-rolled
          # curl|gpg --dearmor pipe: the latter intermittently fails on GitHub
          # runners with "gpg: cannot open '/dev/tty'". The script adds the
          # repo + key non-interactively.
          # No sudo inside the container (we are already root, and bullseye
          # ships without it), so resolve it to a no-op when absent.
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO=sudo
          $SUDO apt-get update
          $SUDO apt-get install -y postgresql-common
          $SUDO /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          $SUDO apt-get install -y postgresql-server-dev-18 build-essential
          echo "PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config" >> "$GITHUB_ENV"

      - name: Build pgvector artifact
        run: |
          chmod +x packages/pgvector-embedded/scripts/build.sh
          PLATFORM=${{ matrix.platform }} packages/pgvector-embedded/scripts/build.sh

      # The floor is a promise to users, so assert it on the artifact rather
      # than trusting the base image. Without this the failure is invisible
      # until a user on an older distro runs `lobu run` — nothing in CI loads
      # this library on an old glibc.
      - name: Assert glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x packages/pgvector-embedded/scripts/assert-glibc-floor.sh
          packages/pgvector-embedded/scripts/assert-glibc-floor.sh \
            "packages/pgvector-embedded/prebuilt/${{ matrix.platform }}"

      - uses: actions/upload-artifact@v7
        with:
          name: pgvector-${{ matrix.platform }}
          # The platform-specific library plus the shared control/SQL (vendored
          # once at the prebuilt root). The least-common-ancestor is `prebuilt/`,
          # so the artifact lays out as `<platform>/vector.*`, `vector.control`,
          # `vector--*.sql`.
          path: |
            packages/pgvector-embedded/prebuilt/${{ matrix.platform }}
            packages/pgvector-embedded/prebuilt/vector.control
            packages/pgvector-embedded/prebuilt/vector--*.sql
          if-no-files-found: error

  open-pr:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/pgvector-artifacts

      - name: Stage regenerated artifacts
        run: |
          PREBUILT=packages/pgvector-embedded/prebuilt
          for dir in /tmp/pgvector-artifacts/pgvector-*; do
            platform="$(basename "$dir" | sed 's/^pgvector-//')"
            dest="$PREBUILT/${platform}"
            rm -rf "$dest"
            mkdir -p "$dest"
            # Platform-specific library lives under <platform>/ in the artifact.
            cp "$dir/$platform/"* "$dest/"
            # Control + SQL are byte-identical across platforms — refresh the
            # single shared copy at the prebuilt root (last writer wins).
            cp "$dir"/vector.control "$dir"/vector--*.sql "$PREBUILT/"
          done

      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="chore/pgvector-embedded-${PGVECTOR_VERSION}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add packages/pgvector-embedded/prebuilt
          if git diff --cached --quiet; then
            echo "No artifact changes — nothing to PR."
            exit 0
          fi
          git commit -m "chore(pgvector-embedded): rebuild prebuilt artifacts (${PGVECTOR_VERSION})"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(pgvector-embedded): rebuild prebuilt artifacts (${PGVECTOR_VERSION})" \
            --body "Regenerated by the build-pgvector-embedded workflow (pgvector ${PGVECTOR_VERSION}, PG 18)."
