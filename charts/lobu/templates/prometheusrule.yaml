{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "lobu.fullname" . }}-automations
  {{- with .Values.metrics.prometheusRule.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "lobu.labels" . | nindent 4 }}
    {{- /* kube-prometheus-stack selects rules by ruleSelector: release=kube-prometheus-stack */}}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    # Deploy-time availability. Every state-based availability alert in the
    # stack (KubeDeploymentReplicasMismatch, KubePodNotReady,
    # KubeDeploymentRolloutStuck, LobuAppRolloutStalled) carries `for: 15m`,
    # so none of them can fire for a short full outage. lobu#2543: the
    # pre-upgrade quiesce scaled the app to zero replicas on EVERY deploy for
    # ~40s, 63 times over 14 days, and nothing alerted — it was found only
    # because a human noticed intermittent 503s. Requires kube-state-metrics.
    - name: lobu-availability
      rules:
        # min_over_time turns a brief EVENT into a condition that persists long
        # enough to alert on, which a `for:` window fundamentally cannot do:
        # `for` requires the outage to still be happening N minutes later.
        - alert: LobuAppNoAvailableReplicas
          expr: |
            min_over_time(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="{{ include "lobu.fullname" . }}-app"}[10m]) == 0
          for: 0m
          labels:
            severity: critical
            service: lobu
          annotations:
            summary: "Lobu app had zero available replicas in the last 10m"
            description: "{{ include "lobu.fullname" . }}-app dropped to 0 available replicas, so the ingress served 503 for that window. Deploy-related unless a node was lost: check whether the pre-upgrade migration hook quiesced (kubectl logs job/{{ include "lobu.fullname" . }}-migrate) and whether it should have — it only quiesces when an incompatible migration is pending (or the check cannot answer)."
    - name: lobu-automations
      rules:
        # Heartbeat / dead-man's-switch. The 12-day outage (lobu#1046) was a
        # SILENT one: the app was healthy but the automation scheduler produced
        # zero successful ticks. Alert on the ABSENCE of success, not just on
        # errors.
        # `or on() vector(0)` makes it fire even if the series disappears (all
        # replicas down / never scraped).
        - alert: AutomationSilent
          expr: |
            (sum(increase(lobu_scheduled_job_runs_total{task="automation",outcome="success"}[15m])) or on() vector(0)) == 0
          for: 15m
          labels:
            severity: critical
            service: lobu
          annotations:
            summary: "Lobu automation has produced no successful tick in 15m"
            description: "The automation scheduler is silent or failing on every tick across all replicas. Automations are not firing. See runs table (run_type='automation') and app logs for `[task] automation`."
        # Internal phase failures. Post-hardening the tick swallows phase errors
        # (so the scheduler-level counter shows success); this surfaces them.
        - alert: AutomationPhaseFailing
          expr: |
            sum(increase(lobu_automation_phase_failures_total[15m])) by (phase) > 0
          for: 15m
          labels:
            severity: warning
            service: lobu
          annotations:
            summary: "Lobu automation phase {{`{{ $labels.phase }}`}} is failing"
            description: "The {{`{{ $labels.phase }}`}} phase of automation threw repeatedly over 15m. Check app logs for `[automation] phase failed`."
        # A critical scheduled job erroring repeatedly (e.g. the stale-run reaper).
        - alert: LobuScheduledJobFailing
          expr: |
            sum(increase(lobu_scheduled_job_runs_total{task=~"automation|check-stalled-executions",outcome="error"}[15m])) by (task) > 0
          for: 15m
          labels:
            severity: warning
            service: lobu
          annotations:
            summary: "Lobu scheduled job {{`{{ $labels.task }}`}} is failing"
            description: "The {{`{{ $labels.task }}`}} cron task threw on every run over 15m."
    - name: lobu-worker-dispatch
      rules:
        # A single device/action timeout is useful audit evidence but not a page.
        # Catch both a sharp regression (3 in 15m) and the historical slow-burn
        # shape (5 in 6h is already a 20/day pace) without recreating the noisy
        # source-health alerts this metric replaced.
        - alert: LobuWorkerDispatchFailuresElevated
          expr: |
            sum(increase(lobu_worker_dispatch_failures_total{namespace="{{ .Release.Namespace }}"}[15m])) by (run_type, reason) >= 3
            or
            sum(increase(lobu_worker_dispatch_failures_total{namespace="{{ .Release.Namespace }}"}[6h])) by (run_type, reason) >= 5
          for: 5m
          labels:
            severity: warning
            service: lobu
          annotations:
            summary: "Lobu worker dispatch failures are recurring"
            description: "{{`{{ $labels.run_type }}`}} runs are repeatedly going unclaimed (reason={{`{{ $labels.reason }}`}}): at least 3 in 15m or 5 in 6h. Connector code did not run; inspect worker poll logs, claim eligibility, and DB/pool health rather than source authentication."
        # This counter increments only after the claim query exhausted its DB
        # retry budget, so one event is already actionable control-plane evidence.
        - alert: LobuWorkerClaimQueryError
          expr: |
            sum(increase(lobu_worker_claim_query_errors_total{namespace="{{ .Release.Namespace }}"}[10m])) by (worker_kind, platform) > 0
          for: 0m
          labels:
            severity: warning
            service: lobu
          annotations:
            summary: "Lobu worker claim query failed after retries"
            description: "A {{`{{ $labels.worker_kind }}`}} worker poll (platform={{`{{ $labels.platform }}`}}) exhausted DB retries while claiming work. Check app logs for classification=dispatch_unavailable and stage=worker_claim_query, then inspect DB pool/lock health."
        # Fleet workers poll every 10s in production. A 5m lookback held false
        # for another 5m detects roughly 10m of silence while ignoring brief
        # rollout gaps. Device polls are intentionally excluded: laptops being
        # offline is normal and is handled by due-feed deferral.
        - alert: LobuFleetWorkerPollingSilent
          expr: |
            (sum(increase(lobu_worker_polls_total{namespace="{{ .Release.Namespace }}",worker_kind="fleet"}[5m])) or on() vector(0)) == 0
          for: 5m
          labels:
            severity: critical
            service: lobu
          annotations:
            summary: "Lobu fleet workers have stopped polling"
            description: "No authorized fleet-worker poll was observed for roughly 10m. Cloud connector work cannot be admitted or claimed. Check worker pods, /api/worker/poll traffic, app ingress, and DB availability."
    - name: lobu-recall
      rules:
        # Query embedding failures degrade recall to text-only ranking without
        # failing requests (lobu#4190). Hold for 30m after the condition clears
        # to bridge gaps in search traffic; Alertmanager controls notifications.
        - alert: LobuRecallQueryEmbeddingFailing
          expr: |
            sum(increase(lobu_recall_query_embedding_failures_total{namespace="{{ .Release.Namespace }}"}[10m])) by (namespace) > 0
          for: 0m
          keep_firing_for: 30m
          labels:
            severity: warning
            service: lobu
          annotations:
            summary: "Lobu search query embedding failures detected"
            description: "Search queries could not be embedded, so recall fell back to text-only ranking. This alert stays firing for 30m after the last detected increase. Check the {{ include "lobu.fullname" . }}-embeddings deployment and app logs for `[search] query embedding failed`."
{{- end }}
