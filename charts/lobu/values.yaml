# Default values for lobu chart

# Global settings
nameOverride: ""
fullnameOverride: ""

# Image settings (shared between app, worker, and embeddings)
image:
  registry: ghcr.io
  repository: lobu-ai/lobu
  pullPolicy: Always
  # Tag defaults to chart appVersion
  tag: "latest"

# Set pull secrets when using a private registry or mirror.
imagePullSecrets: []

# App deployment settings (API backend)
app:
  replicaCount: 1
  # Recreate: the old pod fully terminates before the new one starts, so at most
  # ONE server version is ever live. This is a correctness requirement, not just a
  # single-replica convenience — write-gate policy migrations add scope columns
  # (e.g. operation_key) whose write predicates only the NEW code carries. Under
  # RollingUpdate an old pod could serve a scope-blind UPDATE/DELETE concurrently
  # with the migrated schema and clobber a freshly-written finer-scoped policy row
  # (a persistent fail-open). Recreate removes the two-version overlap window. With
  # replicaCount 1 there is no availability cost vs RollingUpdate (never >1 serving
  # pod anyway). `workspaces.enabled: true` (legacy RWO path) already pinned this.
  strategy:
    type: Recreate

  resources:
    requests:
      # The app pod embeds the orchestrator AND spawns agent-worker subprocesses
      # in-pod, so this container does far more than serve HTTP — yet it was
      # capped at 1 core (the connector worker, which does comparable work, gets
      # 2-4). Under-resourced regardless of the exact stall mechanism; give the
      # event loop real headroom. Request stays modest so it isn't over-reserved.
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 3000m
      # Prod pods OOM-killed (exit 137) at a 2Gi limit — repeatedly. The parent
      # Node heap is only ~300MB; the rest of RSS is the in-pod agent-worker
      # child subprocesses, whose memory counts toward this pod cgroup. Per-child
      # heap is now capped (LOBU_WORKER_MAX_OLD_SPACE_MB), but the pod still needs
      # room for several concurrent workers + parent + proxies. 4Gi matches the
      # connector worker, which does comparable per-run work.
      memory: 4Gi

  # Non-secret environment variables
  env:
    NODE_ENV: production
    # Tags all Sentry events (server + forwarded to the worker subprocess) so a
    # prod deploy can never report under environment=development. Worker spawn
    # forwards this via assembleBaseEnv (base-deployment-manager.ts).
    ENVIRONMENT: production
    # Hold teardown after SIGTERM so /health/ready returns 503 and kube-proxy
    # removes this pod from the Service endpoints before in-flight connections
    # are cut. Keep below terminationGracePeriodSeconds (and roughly aligned
    # with lifecycle.preStopSleepSeconds).
    SHUTDOWN_READINESS_DRAIN_MS: "5000"
    # Bounded wait for in-flight HTTP responses (incl. SSE/MCP streams) to drain
    # before process exit. Keep below the remaining grace-period budget.
    HTTP_CLOSE_TIMEOUT_MS: "10000"

  # Graceful-shutdown budget. Must comfortably exceed the sum of the readiness
  # drain + in-flight HTTP close + gateway/worker teardown, or the kubelet
  # SIGKILLs mid-drain (orphaning workers — the failure `make clean-workers`
  # exists to mop up).
  terminationGracePeriodSeconds: 60

  # preStop sleep keeps the container alive briefly after the pod is marked
  # Terminating, covering the window where kube-proxy endpoint removal lags the
  # SIGTERM. Belt-and-braces with SHUTDOWN_READINESS_DRAIN_MS. Set to 0 to skip.
  lifecycle:
    preStopSleepSeconds: 5

  # Container-level hardening. runAsNonRoot is left unset because the app image
  # currently has no non-root USER (docker/app/Dockerfile) — enable it once the
  # image ships a non-root user. The defaults below are safe to apply even as
  # root and drop a meaningful amount of attack surface.
  # NOTE on connector-contributed CLIs (e.g. `gh`): the embedded worker registers
  # spawned binaries ONLY when it has a working per-exec sandbox. bubblewrap
  # needs `unshare(CLONE_NEWUSER)`, which the RuntimeDefault profile below
  # filters on most runtimes — so as shipped, probeSandboxStrategy reports
  # "none" and a contributed CLI exits 127.
  #
  # That is the SAFE default and is deliberate. Every worker and the gateway
  # share this container as the same user, so without a per-exec sandbox a
  # shell-capable CLI can read sibling `workspaces/{agentId}` directories and
  # the gateway's environment — verified, not theoretical. The pod boundary is
  # per-POD, and the tenants are inside it.
  #
  # MEASURED on this cluster (k3s v1.32.8, containerd 2.0.5, Ubuntu 24.04 /
  # kernel 6.8): bubblewrap CANNOT be enabled by any securityContext change.
  # `unshare --user` succeeds once SYS_ADMIN is added, but bwrap then fails at
  #
  #     bwrap: setting up uid map: Operation not permitted
  #
  # which still failed with SETUID+SETGID+SYS_CHROOT+MKNOD+DAC_OVERRIDE added,
  # allowPrivilegeEscalation: true, AND seccomp removed entirely. Writing
  # /proc/self/uid_map is restricted by the container runtime, not by seccomp or
  # capabilities, so no chart-level knob reaches it.
  #
  # Consequence: connector-contributed CLIs (`gh`) exit 127 on this cluster, by
  # design, and that is the SAFE outcome — see the isolation note above.
  # Enabling them needs a runtime-level change, not a values.yaml edit. Also
  # measured: this cluster declares `crun` and `gvisor` RuntimeClasses, but
  # neither handler is installed on the nodes ("no runtime for \"crun\" is
  # configured" / "...\"runsc\"..."), so switching runtimeClassName is not an
  # available workaround here either.
  #
  # Verify on any cluster before assuming otherwise:
  #   kubectl exec <app-pod> -- bwrap --unshare-user --unshare-pid --ro-bind \
  #     /usr /usr --proc /proc --dev /dev -- /usr/bin/true
  # Exit 0 means contributed CLIs will register; anything else means 127.
  # Do NOT "fix" a non-zero result with LOBU_ALLOW_UNSANDBOXED_EXEC: workers and
  # the gateway share this container, and /proc/1/environ is readable from it.
  #
  # Do NOT reach for `type: Unconfined` (drops the whole filter) or for
  # LOBU_ALLOW_UNSANDBOXED_EXEC (skips the sandbox AND unlocks full
  # interpreters); the latter is a per-agent decision for trusted agents.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # PodDisruptionBudget. Rendered only when replicaCount > 1 so single-replica
  # installs aren't blocked from ever draining a node. minAvailable keeps at
  # least one app pod serving across voluntary disruptions (node drains/upgrades).
  pdb:
    enabled: true
    minAvailable: 1

  # Persistent workspaces volume. The embedded worker stores the
  # durable transcript in Postgres (`agent_transcript_snapshot`); the
  # rest of {WORKSPACE_DIR} (input/output/temp) is pod-local ephemeral
  # — a per-conversation advisory lock pins runs to one pod for the
  # run lifetime. Disable by default so the deployment can roll across
  # replicas; flip to `true` only if you have a specific reason to
  # persist scratch files across restarts.
  workspaces:
    enabled: false
    size: 20Gi
    storageClass: ""

  # Durable binary artifacts (images, audio, files) shared by every app
  # replica. When disabled the chart explicitly uses pod-local /tmp, so media
  # does not survive restarts or reliably cross replicas. The default stays off
  # for local/self-hosted installs; production should enable this with storage
  # that every scheduled app pod can mount.
  # When enabled, ReadWriteOnce is supported only with replicaCount: 1; more
  # than one app replica requires an RWX-capable class and accessMode:
  # ReadWriteMany, and rendering fails closed otherwise. Leaving this disabled
  # on a multi-replica install still renders — media then lands on pod-local
  # /tmp and neither survives a restart nor crosses replicas.
  artifacts:
    enabled: false
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    mountPath: /var/lib/lobu/artifacts

  # Keep replicas off a single node. Without this the scheduler is free to put
  # every replica on one node, where one node loss removes all capacity and the
  # PodDisruptionBudget cannot help (it does not apply to node failure).
  # ScheduleAnyway is deliberate: a hard DoNotSchedule would leave a replica
  # unschedulable when the only other node is cordoned or full, trading a
  # colocation risk for a guaranteed capacity loss. Soft spreads whenever the
  # cluster can and degrades to colocation rather than to nothing.
  # The template pairs this with matchLabelKeys: [pod-template-hash]. That is
  # load-bearing, not a refinement: without it the skew domain includes the
  # OUTGOING ReplicaSet during a rolling update, so whether the new revision
  # ends up spread depends on how old-pod termination interleaves with new-pod
  # scheduling. It is intermittent, not a guaranteed failure -- which is the
  # trap. A rollout that happens to spread is not evidence the scoping is
  # unnecessary, and ScheduleAnyway means the bad outcome never reports.
  topologySpread:
    enabled: true
    topologyKey: kubernetes.io/hostname
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway

# Worker deployment settings
worker:
  enabled: true
  replicaCount: 1
  # RWO cache PVCs cannot be mounted by old and new pods at once.
  # Defaults to Recreate when cache.enabled; override for RWX/no-cache deployments.
  strategy: {}

  # Cache PVCs are mounted as root-owned by default; grant the image user group write access.
  podSecurityContext:
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch

  # Agent/connector runs can be minutes-long; give the daemon time to finish
  # or hand off in-flight runs after SIGTERM before the kubelet escalates to
  # SIGKILL (which orphans runs until the stale-run reaper recovers them).
  terminationGracePeriodSeconds: 300

  # The worker executes untrusted agent/connector code — the highest-value
  # container to harden. runAsUser must stay numeric and match the image's
  # UID (docker/worker/Dockerfile: useradd -u 1001): the kubelet cannot
  # verify runAsNonRoot from a named image USER and rejects the container
  # with CreateContainerConfigError, wedging the rollout until Helm's
  # --wait timeout.
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  env:
    POLL_INTERVAL_MS: "10000"
    # Tag Sentry events from the worker/embeddings deployment as production.
    ENVIRONMENT: production

  # Transformer model cache volume
  cache:
    enabled: true
    size: 5Gi
    storageClass: ""

# Embeddings service deployment settings
embeddings:
  enabled: true
  replicaCount: 1
  # RWO cache PVCs cannot be mounted by old and new pods at once.
  # Defaults to Recreate when cache.enabled; override for RWX/no-cache deployments.
  strategy: {}

  # Cache PVCs are mounted as root-owned by default; grant the image user group write access.
  podSecurityContext:
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch

  # runAsUser must stay numeric and match the image's UID
  # (docker/embeddings-service/Dockerfile: useradd -u 1001) so the kubelet
  # can verify runAsNonRoot without inferring from image metadata.
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  serviceUrl: ""

  resources:
    requests:
      # Bumped from 500m: the local embedding model runs CPU-bound and inline, so
      # 500m starved it — batches blocked the event loop long enough to trip the
      # liveness probe (prod backfill -> SIGKILL -> failed embeddings + restart loop).
      cpu: 1000m
      memory: 1Gi
    limits:
      memory: 3Gi

  # The embeddings service runs the model INLINE on a single-threaded event loop, so
  # a heavy batch blocks /health. The app's shared probe (3s timeout x3) killed a
  # busy-but-healthy service mid-request in prod. Liveness must detect a DEAD process,
  # not a BUSY one, so the embeddings service gets its own tolerant probe.
  healthCheck:
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 10
      failureThreshold: 6
    livenessProbe:
      initialDelaySeconds: 45
      periodSeconds: 30
      timeoutSeconds: 15
      failureThreshold: 8

  # Every non-credential embeddings setting lives HERE, not in the shared
  # secret. The deployment projects exactly EMBEDDINGS_SERVICE_TOKEN and
  # EMBEDDINGS_API_KEY out of `secretName`, so a release that used to supply
  # EMBEDDINGS_BACKEND / MODEL / API_URL / DIMENSIONS / BATCH_SIZE / NORMALIZE /
  # TIMEOUT_MS through that secret stops receiving them. That degrades silently:
  # the service falls back to the `local` backend and writes vectors of the
  # wrong dimension rather than failing. An existing release carrying any of
  # those keys in its shared secret has to move them into this map before the
  # chart upgrade, not after.
  env: {}

  service:
    port: 8790

  cache:
    enabled: true
    size: 5Gi
    storageClass: ""

# Service settings
service:
  type: ClusterIP
  port: 8787
  # Pin each client to the same pod for the lifetime of the affinity
  # window. Required when running >1 app replica: SSE streams
  # (`/api/v1/agents/<id>/events`) and the per-pod backlog in
  # `SseManager` are not cross-pod — a client whose first SSE chunk
  # lands on pod A and whose later run claim lands on pod B would
  # silently miss events. ClientIP affinity works at kube-proxy
  # without any ingress controller config. Disabled by default; the
  # helmrelease in deploy/k8s opts in alongside `replicaCount: 2`.
  #
  # `sessionAffinity` accepts "None" (default) or "ClientIP". The
  # timeout is the affinity window in seconds (default 10800 = 3h);
  # set lower if NAT churn is a concern.
  sessionAffinity: None
  sessionAffinityTimeoutSeconds: 10800

# Ingress settings
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts: []  # List of hosts (e.g., [summaries.now, app.lobu.ai])
  tls: []

# Secret reference (must exist in namespace)
# Contains: ENCRYPTION_KEY, BETTER_AUTH_SECRET, provider API keys, etc.
secretName: ""

# Database settings (for connecting to CNPG cluster)
database:
  # If set, overrides DATABASE_URL from secret
  host: ""
  port: 5432
  name: "app"  # Database name (required when usePooler=true)
  # Secret containing database credentials (from CNPG)
  existingSecret: ""
  existingSecretKey: "uri"
  # Use PgBouncer pooler instead of direct connection
  usePooler: false
  poolerService: ""  # e.g., "db-pooler-rw"

# Health check settings
healthCheck:
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

migrations:
  enabled: false
  # Incompatible migrations cannot run while an old app or worker still uses
  # the previous schema. An upgrade first asks the schema_migrations ledger
  # whether anything is pending (migrate-up.mjs --check-pending), which also
  # validates any declared prerequisites (docs/MIGRATIONS.md); if nothing is
  # pending, or every pending migration is marked -- lobu:no-quiesce (backward
  # compatible), the deployments keep serving and Helm rolls without downtime.
  # When an incompatible migration is pending, the upgrade records the current
  # replica counts, scales both deployments to zero, and waits for their pods
  # to terminate before migrating. A check that fails or cannot answer aborts
  # the upgrade before anything is scaled. A failed migration restores those
  # counts and waits for both deployments to be ready; after success Helm
  # applies the new release's configured replica counts. The migration Job
  # makes one attempt. Keep the release controller's upgrade retries at zero
  # too, so another Job cannot repeat the same failure automatically.
  quiesceBeforeUpgrade:
    image: bitnami/kubectl@sha256:9e369df7ab3386b736d162348f167bcc02cb4ba3f5203e9151be854437d6e0af
    pullPolicy: IfNotPresent
    timeoutSeconds: 300
  database:
    existingSecret: ""
    existingSecretKey: "uri"
    name: "app"
    usePooler: false
    poolerService: ""

releaseGates:
  databasePreflight:
    # When migrations are enabled, verify the target database is reachable
    # before invoking the migration runner. This fails fast on wrong DB names
    # instead of attempting migrations against a missing production database.
    enabled: true
    timeoutSeconds: 10
  smokeTest:
    # Helm post-install/post-upgrade hook. The release is not considered
    # healthy until the in-cluster app Service responds successfully.
    enabled: true
    path: /api/health
    timeoutSeconds: 300
    intervalSeconds: 2

    # Phase 3 — drive an actual worker run end-to-end.
    #
    # When enabled, the Job POSTs to /api/internal/smoke/dispatch, which
    # inserts a synthetic chat_message run. The runs-queue MessageConsumer
    # claims it, spawns a worker subprocess, and on completion writes a
    # row into `agent_transcript_snapshot`. The Job polls for that row
    # and fails the deploy if `terminal_status='completed'` doesn't
    # materialise within `timeoutSeconds`.
    #
    # Default OFF. Operators MUST add three keys to the deployment Secret
    # before enabling, AND preprovision a matching agent row:
    #
    #   SMOKE_TEST_TOKEN=<random ≥32 chars>
    #   SMOKE_TEST_AGENT_ID=<your-smoke-agent-id>
    #   SMOKE_TEST_ORG_ID=<your-smoke-org-id>
    #
    # The gateway PINS the smoke agentId + organizationId from the env
    # at dispatch time — caller-supplied values in the dispatch body are
    # ignored. This makes a leaked SMOKE_TEST_TOKEN structurally unable
    # to dispatch a synthetic run against a real tenant. Mirrored from
    # lobu#878.
    workerSmoke:
      enabled: false
      conversationIdPrefix: "smoke-"
      timeoutSeconds: 90
      intervalSeconds: 3

# Prometheus metrics scraping + alerting. Requires the prometheus-operator CRDs
# (kube-prometheus-stack). Both default OFF so the chart installs without the
# operator; the prod overlay (owletto-deploy) turns them on. The Prometheus in
# this cluster selects by `release: kube-prometheus-stack`, so set that under
# additionalLabels when enabling.
metrics:
  serviceMonitor:
    enabled: false
    # namespace: ""        # defaults to the release namespace
    # Metrics are exposed by the gateway, mounted under /lobu by the unified
    # server — so the scrape path is /lobu/metrics (root /metrics redirects).
    path: /lobu/metrics
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}   # e.g. { release: kube-prometheus-stack }
  prometheusRule:
    enabled: false
    # namespace: ""
    additionalLabels: {}   # e.g. { release: kube-prometheus-stack }
