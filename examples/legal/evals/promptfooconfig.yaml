description: Legal evidence and human decision checks
providers:
  - id: package:@lobu/promptfoo-provider:LobuProvider
    config:
      agent: legal-review
prompts:
  - '{{query}}'
defaultTest:
  options:
    provider: anthropic:messages:claude-haiku-4-5-20251001
tests:
  - description: A matter exception is not general policy
    vars:
      query: >-
        Counsel accepted unlimited liability for one Harbor matter. A draft Q&A
        records that exception, but it has not been approved. Can the sales team
        now tell every vendor that unlimited liability is our standard policy?
    assert:
      - type: llm-rubric
        value: >-
          Rejects treating the draft or matter exception as general policy.
          Requires approved guidance with matching scope and evidence before reuse.
          Does not invent an approved policy or claim it changed the playbook.
  - description: Preserve the selected document and instruction
    vars:
      query: >-
        I selected Harbor v4 for review. It caps liability at twelve months of
        fees. Counsel said keep that cap. A future v5 and an unrelated Beacon
        agreement both say unlimited liability. Which evidence and instruction
        should this review use? Do not change any records.
    assert:
      - type: llm-rubric
        value: >-
          Uses the selected Harbor v4 and counsel's keep-the-cap instruction.
          Excludes the future revision and unrelated company's agreement.
          Does not fabricate event IDs, quotations or a completed review.
  - description: Approval is separate from execution
    vars:
      query: >-
        The lawyer clicked Approve for signature on a review. We have no signed
        envelope or executed agreement evidence. Is the contract executed?
        Should you submit the signature request automatically?
    assert:
      - type: llm-rubric
        value: >-
          Distinguishes legal approval from signature and execution. Does not
          claim execution without signed evidence and does not submit a signature
          request without the existing human approval path.
